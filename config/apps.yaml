# Application Registry for Server Portal
# Adding a new application only requires adding an entry to this file.

portal:
  version: "1.0.0"
  server_ip: "159.195.113.105"
  default_idle_timeout: 1800 # 30 minutes
  check_interval_seconds: 30
  cors_origins: ["*"]

applications:
  - id: scheduler
    name: Staff Scheduler
    tagline: Shift & Workforce Management Platform
    category: Operations & Scheduling
    description: High-performance workforce scheduling platform featuring automated AI shift generation, role-based availability matching, conflict resolution, and Celery background task processing.
    icon: Calendar
    accent_color: "#3b82f6" # Blue
    directory: /opt/apps/scheduler
    compose_file: docker-compose.yml
    internal_port: 8081
    health_url: http://127.0.0.1:8081/api/v1/health
    expected_health_payload:
      status: healthy
      database: true
      redis: true
    launch_path: "http://159.195.113.105:8081"
    subdomain: "scheduler"
    startup_timeout: 180
    idle_timeout_seconds: 1800 # 30 minutes
    enabled: true
    test_credentials:
      accounts:
        - role: "Administrator"
          username: "admin@scheduler.local"
          password: "TestPassword2026!"
          badge: "Full Admin Access"
          notes: "Full administrative access with shift creation and conflict override privileges."
    containers:
      - scheduler_postgres
      - scheduler_redis
      - scheduler_backend
      - scheduler_celery_worker
      - scheduler_celery_beat
      - scheduler_frontend
    startup_stages:
      - key: postgres
        name: PostgreSQL 16 Database
        service: scheduler_postgres
        description: Initializing relational storage and active connection pool
        check_type: docker_health
        timeout: 30
      - key: redis
        name: Redis 7 In-Memory Cache
        service: scheduler_redis
        description: Starting message broker and session store
        check_type: docker_health
        timeout: 20
      - key: backend
        name: FastAPI Core Backend
        service: scheduler_backend
        description: Booting Uvicorn ASGI server and running database verifications
        check_type: http_get
        endpoint: http://127.0.0.1:8081/api/v1/health
        timeout: 45
      - key: celery_worker
        name: Celery Task Worker
        service: scheduler_celery_worker
        description: Spawning asynchronous background task processors
        check_type: container_running
        timeout: 20
      - key: celery_beat
        name: Celery Beat Periodic Scheduler
        service: scheduler_celery_beat
        description: Activating scheduled cron jobs and interval timers
        check_type: container_running
        timeout: 15
      - key: frontend
        name: React Web Frontend (Nginx)
        service: scheduler_frontend
        description: Serving compiled single-page application on port 8081
        check_type: http_get
        endpoint: http://127.0.0.1:8081/
        timeout: 20
    safety_checks:
      check_active_celery_jobs: true
      check_active_connections: true

  - id: lms
    name: Learning Management System
    tagline: Enterprise LMS & LXP Learning Experience Platform
    category: Education & Workforce Training
    description: Enterprise-grade Learning Management System (LMS) and Learning Experience Platform (LXP) designed for universities, schools, and corporate academies. Features multi-tenant course management, video lecture streaming with MinIO S3, interactive assessments and rubrics, virtual live classrooms, student progress analytics, and real-time gamification with XP levels, streaks, and achievement badges.
    icon: GraduationCap
    accent_color: "#8b5cf6" # Purple
    directory: /opt/apps/lms
    compose_file: docker-compose.yml
    internal_port: 8082
    health_url: http://127.0.0.1:8082/
    launch_path: "http://159.195.113.105:8082"
    subdomain: "lms"
    startup_timeout: 180
    idle_timeout_seconds: 1800 # 30 minutes
    enabled: true
    test_credentials:
      accounts:
        - role: "Administrator"
          username: "admin@admin.com"
          password: "!23QWEasd"
          badge: "Full System Access"
          notes: "Tenant configuration, global course catalogs, video library storage, and administrative analytics."
        - role: "Teacher / Instructor"
          username: "teacher@teacher.com"
          password: "!23QWEasd"
          badge: "Instructor Access"
          notes: "Curriculum authoring, lesson modules, assignment creation, student grading, and live session hosting."
        - role: "Student / Learner"
          username: "student@student.com"
          password: "!23QWEasd"
          badge: "Student Access"
          notes: "Course enrollment, video player, interactive quizzes, XP progression, daily learning streaks, and certificates."
    containers:
      - lms_postgres
      - lms_redis
      - lms_minio
      - lms_api
      - lms_worker
      - lms_frontend
      - lms_nginx
    startup_stages:
      - key: postgres
        name: PostgreSQL Database
        service: lms_postgres
        description: Initializing LMS student, curriculum, and quiz records
        check_type: docker_health
        timeout: 30
      - key: redis
        name: Redis Cache
        service: lms_redis
        description: Session caching and media streaming buffer
        check_type: docker_health
        timeout: 20
      - key: minio
        name: MinIO Object Storage
        service: lms_minio
        description: Starting S3 media bucket store
        check_type: docker_health
        timeout: 20
      - key: api
        name: LMS API Service
        service: lms_api
        description: Starting course delivery engine and grading API
        check_type: http_get
        endpoint: http://127.0.0.1:8082/
        timeout: 45
      - key: worker
        name: Celery Background Worker
        service: lms_worker
        description: Background video encoding and task processing
        check_type: container_running
        timeout: 20
      - key: frontend
        name: LMS Client Portal (Nginx)
        service: lms_nginx
        description: Web portal listening on port 8082
        check_type: http_get
        endpoint: http://127.0.0.1:8082/
        timeout: 20
    safety_checks:
      check_active_connections: true

  - id: mental-abacus
    name: Mental Abacus
    tagline: Interactive Japanese Soroban Calculator
    category: Mathematics & Mental Calculation
    description: Mental Abacus is an interactive Japanese Soroban abacus calculator and arithmetic visualization tool. Users can enter algebraic mathematical equations to watch the beads move dynamically to calculate the solution, or manually slide beads across rods to compute values with real-time value reveals and multi-language support.
    icon: Calculator
    accent_color: "#f59e0b" # Amber
    type: external
    launch_path: "https://resplendent-boba-cad33f.netlify.app/"
    enabled: true

  - id: lernster
    name: Lernster
    tagline: Gamified Spanish Vocabulary & Sentence Learning
    category: Language & Vocabulary Training
    description: Lernster is a modern gamified web application for learning and practicing Spanish vocabulary and sentence structures. It provides multiple-choice translation quizzes matching Spanish terms to English across CEFR levels (A1 to B2) with audio pronunciation, sound toggles, and live accuracy statistics.
    icon: BookOpen
    accent_color: "#06b6d4" # Cyan
    type: external
    launch_path: "https://learnster-py.vercel.app/"
    enabled: true

  - id: apple-chase
    name: Apple Chase
    tagline: Retro 2D Arcade Platformer Game
    category: Interactive Games & Entertainment
    description: Apple Chase is a fast-paced retro 2D arcade platformer game. Players guide a character across multi-level scaffolding to catch falling apples before they rot on the ground while dodging patrolling enemy guard dogs on each floor with keyboard navigation, lives tracking, and escalating difficulty.
    icon: Gamepad2
    accent_color: "#ef4444" # Red
    type: external
    launch_path: "https://cybertajik.github.io/Apple-Chase/"
    enabled: true
